name: Apply auth settings

# Keeps the live Supabase Auth settings equal to supabase/auth-config.json.
# 8 Oct 2026, security batch 1: public sign-up off. Same token as apply-sql.
on:
  push:
    branches: [ main ]
    paths: [ 'supabase/auth-config.json', 'scripts/apply-auth-config.mjs', '.github/workflows/apply-auth-config.yml' ]
  workflow_dispatch:

concurrency:
  group: apply-auth-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-auth-config.mjs
