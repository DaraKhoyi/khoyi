name: PR smoke gate (no publish)

# Runs the SAME smoke gate as deploy.yml on a pull request, so a PR can show
# green CI BEFORE anyone merges it. It never publishes, never deploys functions
# and never applies SQL: there is no gh-pages step and the token is read-only.
# Added 9 Oct 2026 for the CRM build (Dara: nothing merges without my yes).
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          NODE_ENV: production
        run: npm run build
      - name: Smoke gate (same as deploy.yml, full lane)
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GATE_LANE: full
          LANE_BASE: ""
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          SUPABASE_SERVICE_KEY=""
          for attempt in 1 2 3; do
            RESP=$(curl -s -w '\n%{http_code}' "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "User-Agent: KhoyiApp/1.0")
            CODE=$(printf '%s' "$RESP" | tail -n1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            if [ "$CODE" = "200" ]; then
              SUPABASE_SERVICE_KEY=$(printf '%s' "$BODY" | python3 -c "import sys,json; print(next((k['api_key'] for k in json.load(sys.stdin) if k.get('name')=='service_role'), ''))" 2>/dev/null || true)
            fi
            [ -n "$SUPABASE_SERVICE_KEY" ] && break
            echo "→ could not mint service key (HTTP $CODE), attempt $attempt/3; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "✗ SMOKE GATE CANNOT RUN — could not mint a service_role key (HTTP $CODE). Not a code failure." >&2; exit 2; fi
          echo "::add-mask::$SUPABASE_SERVICE_KEY"
          export SUPABASE_SERVICE_KEY
          bash smoke/run.sh
