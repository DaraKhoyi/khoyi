name: Deploy Edge Functions

# Deploys ONLY the edge functions whose files changed in the push.
# verify_jwt is taken from supabase/config.toml, so auth settings are preserved.
on:
  push:
    branches: [ main ]
    paths: [ 'supabase/functions/**' ]
  workflow_dispatch:

concurrency:
  group: edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed functions
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          FUNCS=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'supabase/functions/*/**' \
            | sed -E 's#supabase/functions/([^/]+)/.*#\1#' | sort -u | grep -v '^_' || true)
          # A change to supabase/functions/_shared/<file> must redeploy EVERY
          # function that imports it — each function bundles its own copy at
          # deploy time. Until 26 Sep this step skipped _shared entirely, and
          # the 19 Sep change to _shared/aiUsage.ts (record WHAT each AI spend
          # was about) never reached the functions that use it.
          SHARED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'supabase/functions/_shared/**' | xargs -r -n1 basename || true)
          for f in $SHARED; do
            USERS=$(grep -rlE "_shared/${f}['\"]" supabase/functions --include=*.ts --include=*.js \
              | sed -E 's#supabase/functions/([^/]+)/.*#\1#' | grep -v '^_' || true)
            FUNCS=$(printf '%s\n%s\n' "$FUNCS" "$USERS" | sed '/^$/d' | sort -u)
          done
          echo "Changed functions:"; echo "$FUNCS"
          {
            echo "funcs<<EOF"
            echo "$FUNCS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        if: steps.changed.outputs.funcs != ''
        run: npm i supabase --no-save --no-audit --no-fund

      - name: Deploy changed functions
        if: steps.changed.outputs.funcs != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SB=./node_modules/.bin/supabase
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::Deploy $fn"
            "$SB" functions deploy "$fn" --project-ref xlgfspnojjgvkuitcoaf
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.funcs }}"
