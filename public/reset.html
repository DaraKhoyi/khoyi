<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Refresh PrismOS</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #100D09; color: #F6F1E7;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; }
  h1 { font-weight: 300; font-size: 26px; margin: 0 0 10px; }
  p { color: #B9B0A0; font-size: 15px; line-height: 1.5; max-width: 340px; margin: 0 auto 18px; }
  a { color: #C5A95E; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<!-- darasapp.com/reset.html — for a phone stuck on an old saved copy of PrismOS.
     Removes the saved copy and the service worker on THIS device, then opens the
     current version. It does not sign anyone out and touches no data: everything
     in PrismOS lives on the server. (2 Oct 2026) -->
<div>
  <h1 id="h">Getting the current version…</h1>
  <p id="p">This clears the saved copy of PrismOS on this phone. Your data is not touched and you stay signed in.</p>
  <a id="a" href="/" style="display:none">Open PrismOS</a>
</div>
<script>
(function () {
  var done = false;
  function finish() {
    if (done) return; done = true;
    document.getElementById('h').textContent = 'Done.';
    document.getElementById('p').textContent = 'Opening the current version of PrismOS.';
    document.getElementById('a').style.display = 'inline';
    setTimeout(function () { window.location.replace('/?fresh=' + Date.now()); }, 900);
  }
  try {
    var jobs = [];
    if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== 'prismos-shared'; }).map(function (k) { return caches.delete(k); })); }));
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    Promise.all(jobs).then(finish, finish);
    setTimeout(finish, 4000);
  } catch (_) { finish(); }
})();
</script>
</body>
</html>
