<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- The one-time code must never leak to another site through the Referer header. -->
<meta name="referrer" content="no-referrer">
<title>Connecting Google | PrismOS</title>
<!--
  GOOGLE OAUTH REDIRECT RELAY (8 Oct 2026, Google verification).

  Google only accepts redirect URIs on domains we can verify, and the Supabase
  function address (*.supabase.co) is not one of them. So Google sends people
  here, https://darasapp.com/oauth/google/callback, and this page hands the
  exact same query string (?code=...&state=... or ?error=...) to the
  google-oauth-callback function, which checks the signed state, exchanges the
  code using this same redirect_uri, saves the connection and sends the person
  back into PrismOS. This page stores nothing, calls nothing else and runs no
  third-party code. location.replace() keeps the code out of browser history.

  Served at /oauth/google/callback (this file) and /oauth/google/callback/
  (the copy in callback/index.html). Keep the two identical.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0A08;color:#FAF7F0;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
  .box{max-width:440px;border:1px solid #3A3224;border-top:3px solid #C5A95E;border-radius:14px;background:#15120D;padding:30px 28px}
  .brand{font-family:"Playfair Display",Georgia,serif;color:#C5A95E;font-size:24px;margin:0 0 12px}
  p{margin:6px 0;color:#B9B0A0;font-size:14.5px;line-height:1.6}
  a{color:#C5A95E}
</style>
</head>
<body>
<div class="box">
  <p class="brand">PrismOS</p>
  <p id="msg">Finishing your Google connection&hellip;</p>
  <noscript><p>This step needs JavaScript. Turn it on and connect again from Settings.</p></noscript>
</div>
<script>
(function () {
  var CALLBACK = 'https://xlgfspnojjgvkuitcoaf.supabase.co/functions/v1/google-oauth-callback';
  var q = location.search || '';
  var params = new URLSearchParams(q);
  // Only ever forward what Google sends back: a state plus a code or an error.
  if (params.get('state') && (params.get('code') || params.get('error'))) {
    location.replace(CALLBACK + q);
    return;
  }
  var el = document.getElementById('msg');
  el.innerHTML = 'This link is not a Google sign-in reply. <a href="/">Return to PrismOS</a>';
})();
</script>
</body>
</html>
