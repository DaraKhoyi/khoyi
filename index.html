<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>/* Restore a deep-link path handed over by 404.html so the SPA router can read it */(function(){try{var m=location.search.match(/[?&]__spa=([^&]*)/);if(m){var t=decodeURIComponent(m[1]);if(t&&t.charAt(0)==='/')history.replaceState(null,'',t);}}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="description" content="PrismOS — Dara's personal operating system" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrismOS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>PrismOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
    <script>
      // OPENING THE APP ON AN OLD COPY HEALS ITSELF (2 Oct 2026).
      // Dara, 9:21pm: "The app is not loading. It says it's loading an offline
      // older copy from many versions ago. Let the current version load."
      // When the page request fails for a moment (weak signal, a network blip),
      // the service worker hands back a saved copy of the app so it still opens.
      // That copy then ran for the whole session, and it could be many versions
      // old. Now: the moment the app opens, it asks the server which build is
      // current. If it is not this one, and nobody has typed anything yet, it
      // loads the current one — once. This is a COLD START only (the first few
      // seconds, before any typing); a running app is still never reloaded for a
      // new version unless the person taps Update (smoke/no_forced_update.mjs).
      (function () {
        try {
          var el = document.querySelector('script[src*="/static/js/main."]');
          var m = el && String(el.getAttribute('src')).match(/main\.([A-Za-z0-9_-]+)\.js/);
          if (!m || !window.fetch) return;
          var mine = m[1], typed = false, t0 = Date.now();
          var mark = function () { typed = true; };
          window.addEventListener('keydown', mark, true);
          window.addEventListener('input', mark, true);
          var ctl = ('AbortController' in window) ? new AbortController() : null;
          var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
          fetch('/index.html?boot=' + t0, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (html) {
              clearTimeout(timer);
              var n = html.match(/main\.([A-Za-z0-9_-]+)\.js/);
              if (!n || n[1] === mine) return;                       // this IS the current build
              if (typed || Date.now() - t0 > 8000) return;           // someone is working: the Update banner offers it instead
              var KEY = '__staleShellReload';
              if (sessionStorage.getItem(KEY) === n[1]) return;      // already tried once for this build: never loop
              sessionStorage.setItem(KEY, n[1]);
              window.__prismStaleShellReload = true;
              window.location.reload();
            })
            .catch(function () { /* offline: the saved copy is the best there is right now */ });
        } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var reloading = false;
        // Was this page ALREADY controlled by a service worker when it loaded?
        // If not, this is the very first visit on this device.
        var hadController = !!navigator.serviceWorker.controller;
        // When a NEW SW replaces an old one (an update), reload once so the page
        // swaps to the new bundle. Guarded against loops.
        //
        // NOT on the first install. sw.js calls clients.claim(), so on a first
        // visit 'controllerchange' fires too (no controller -> the SW) — and the
        // page reloaded itself a moment after opening. Measured 26 Sep: every
        // fresh visit reloaded once. On a phone, that lands seconds in, while a
        // new agent is typing their email and password: the form is wiped and
        // the Sign In tap sends nothing. It was also the week-long "flaky"
        // functional check — the test signed in, the reload threw the form
        // away, and the checks ran against the sign-in screen. There is nothing
        // to swap to on a first install: the page is already the current build.
        // UPDATES ARE THE PERSON'S CHOICE (28 Sep 2026). Dara lost a note he was
        // writing when a new version swapped itself in mid-task. The page now
        // reloads for a new version ONLY after the person taps Update (the React
        // UpdateBanner sets window.__prismUpdateRequested). A new service worker
        // taking control for any other reason changes nothing on screen.
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) { hadController = true; return; }
          if (!window.__prismUpdateRequested || reloading) return;
          reloading = true;
          window.location.reload();
        });

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            // A new version was already downloaded and is waiting.
            // Tell the app; its UpdateBanner shows the one "New version" prompt.
            function ready() { window.__prismUpdateReady = true; window.dispatchEvent(new Event('prism-update-ready')); }
            if (reg.waiting && navigator.serviceWorker.controller) ready();
            // A new version starts installing while the app is open.
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                // "installed" + an existing controller == an update (not first install).
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  ready();
                }
              });
            });
            // Resumed/backgrounded PWAs don't navigate, so poll for a new SW
            // whenever the app comes back to the foreground.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') { reg.update().catch(function () {}); }
            });
          }).catch(function (err) {
            console.warn('SW registration failed:', err);
          });
        });
      })();
    </script>
  </body>
</html>
