    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var reloading = false;
        // Was this page ALREADY controlled by a service worker when it loaded?
        // If not, this is the very first visit on this device.
        var hadController = !!navigator.serviceWorker.controller;
        // When a NEW SW replaces an old one (an update), reload once so the page
        // swaps to the new bundle. Guarded against loops.
        //
        // NOT on the first install. sw.js calls clients.claim(), so on a first
        // visit 'controllerchange' fires too (no controller -> the SW) — and the
        // page reloaded itself a moment after opening. Measured 26 Sep: every
        // fresh visit reloaded once. On a phone, that lands seconds in, while a
        // new agent is typing their email and password: the form is wiped and
        // the Sign In tap sends nothing. It was also the week-long "flaky"
        // functional check — the test signed in, the reload threw the form
        // away, and the checks ran against the sign-in screen. There is nothing
        // to swap to on a first install: the page is already the current build.
        // UPDATES ARE THE PERSON'S CHOICE (28 Sep 2026). Dara lost a note he was
        // writing when a new version swapped itself in mid-task. The page now
        // reloads for a new version ONLY after the person taps Update (the React
        // UpdateBanner sets window.__prismUpdateRequested). A new service worker
        // taking control for any other reason changes nothing on screen.
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) { hadController = true; return; }
          if (!window.__prismUpdateRequested || reloading) return;
          reloading = true;
          window.location.reload();
        });

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            // A new version was already downloaded and is waiting.
            // Tell the app; its UpdateBanner shows the one "New version" prompt.
            function ready() { window.__prismUpdateReady = true; window.dispatchEvent(new Event('prism-update-ready')); }
            if (reg.waiting && navigator.serviceWorker.controller) ready();
            // A new version starts installing while the app is open.
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                // "installed" + an existing controller == an update (not first install).
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  ready();
                }
              });
            });
            // Resumed/backgrounded PWAs don't navigate, so poll for a new SW
            // whenever the app comes back to the foreground.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') { reg.update().catch(function () {}); }
            });
          }).catch(function (err) {
            console.warn('SW registration failed:', err);
          });
        });
      })();
    </script>
