# Move this to .github/workflows/auto-fix.yml to activate (requires the PAT to have
# Workflows + Secrets + Actions permissions). Triggered by repository_dispatch.
name: auto-fix
on:
  repository_dispatch:
    types: [auto_fix]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run supervised auto-fix (staging only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REACT_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          SIGNATURE_ID: ${{ github.event.client_payload.signature_id }}
          FIX_ID: ${{ github.event.client_payload.fix_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/auto-fix.mjs
